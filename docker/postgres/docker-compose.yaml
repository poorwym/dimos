services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    image: ghcr.io/dimensionalos/postgres:${POSTGRES_IMAGE_TAG:-local}
    container_name: dimos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dimos}
      POSTGRES_USER: ${POSTGRES_USER:-dimos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dimos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dimos-postgres-data:
